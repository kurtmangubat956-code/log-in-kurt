<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0">

  <div class="flex min-h-screen">

    <div class="w-1/2 bg-gray-100 flex items-center justify-center px-20">
      <div class="w-full max-w-md">

        <img src="Kurt pic.jpg"
             alt="Logo"
             class="w-28 h-28 mx-auto mb-8 rounded-full object-cover">

        <h1 class="text-3xl font-bold mb-6">Login</h1>

        <input type="text" id="username" placeholder="Username"
               class="w-full mb-4 px-4 py-3 rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">

        <input type="password" id="password" placeholder="Password"
               class="w-full mb-6 px-4 py-3 rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">

        <button id="loginBtn"
                class="w-full py-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-medium transition">
          Login
        </button>
      </div>
    </div>

    <div id="purplePanel"
         class="w-1/2 bg-purple-500 flex items-center justify-center transition-colors duration-500">
      <div class="flex items-center gap-3">
        <span class="text-white text-xl font-bold">Welcome to the purple section!</span>
        <button id="clickMeBtn"
                class="px-4 py-2 rounded-md bg-green-500 hover:bg-green-600 text-white font-medium transition">
          Click me
        </button>
        <button id="changeColorBtn"
                class="px-4 py-2 rounded-md bg-yellow-500 hover:bg-yellow-600 text-white font-medium transition">
          Change Color
        </button>
      </div>
    </div>

  </div>

<script src="kurt.js"></script>
</body>
</html>
